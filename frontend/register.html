<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Banana Quest</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="auth-container">

        <header class="auth-header">
            <h1>🍌 Banana Quest</h1>
            <p>Create your account and start your puzzle adventure.</p>
        </header>

        <section class="auth-card">

            <h2>Create Account</h2>
            <p>Enter your details to join Banana Quest.</p>

            <form id="register-form">

                <label for="register-username">Username</label>
                <input
                    type="text"
                    id="register-username"
                    name="username"
                    minlength="3"
                    maxlength="30"
                    autocomplete="username"
                    placeholder="Choose a username"
                    required
                >

                <label for="register-password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        aria-label="Show password"
                        aria-pressed="false"
                        data-password-target="register-password"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <label for="confirm-password">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        placeholder="Enter your password again"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        aria-label="Show password"
                        aria-pressed="false"
                        data-password-target="confirm-password"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="submit-button">
                    Create Account
                </button>

            </form>

            <p
                id="auth-message"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

            <p class="auth-link">
                Already have an account?
                <a href="/login.html">Login here</a>
            </p>

        </section>

        <footer>
            <p>Banana Quest · Solve puzzles and test your skills!</p>
        </footer>

    </main>

    <script>
        document.querySelectorAll(".toggle-password").forEach((button) => {
            button.addEventListener("click", () => {
                const passwordId = button.dataset.passwordTarget;
                const passwordInput = document.getElementById(passwordId);

                const shouldShow = passwordInput.type === "password";

                passwordInput.type = shouldShow ? "text" : "password";

                button.setAttribute(
                    "aria-label",
                    shouldShow ? "Hide password" : "Show password"
                );

                button.setAttribute(
                    "aria-pressed",
                    String(shouldShow)
                );

                // Swap between the open-eye and crossed-eye icons.
                button.innerHTML = shouldShow
                    ? `
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-4 4.8"></path>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.2 3.3-.6"></path>
                        </svg>
                    `
                    : `
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    `;
            });
        });

        const registerForm = document.getElementById("register-form");
        const authMessage = document.getElementById("auth-message");

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document
                .getElementById("register-username")
                .value.trim();

            const password = document
                .getElementById("register-password")
                .value;

            const confirmPassword = document
                .getElementById("confirm-password")
                .value;

            const submitButton = registerForm.querySelector(
                "button[type='submit']"
            );

            if (password !== confirmPassword) {
                authMessage.textContent = "Passwords do not match.";
                authMessage.className = "auth-message error";
                return;
            }

            submitButton.disabled = true;
            authMessage.textContent = "Creating your account...";
            authMessage.className = "auth-message";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || result.error || "Registration failed."
                    );
                }

                authMessage.textContent =
                    result.message || "Registration successful!";

                authMessage.className = "auth-message success";

                registerForm.reset();

                // Return both password fields to hidden mode.
                document.querySelectorAll(".toggle-password").forEach((button) => {
                    button.setAttribute("aria-label", "Show password");
                    button.setAttribute("aria-pressed", "false");

                    button.innerHTML = `
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7S18.5 19 12 19 2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    `;
                });

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1200);

            } catch (error) {
                authMessage.textContent =
                    error.message || "Unable to register. Please try again.";

                authMessage.className = "auth-message error";

            } finally {
                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
