<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Banana Quest</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="auth-container">

        <header class="auth-header">
            <h1>🍌 Banana Quest</h1>
            <p>Welcome back! Continue your puzzle adventure.</p>
        </header>

        <section class="auth-card">

            <h2>Login</h2>
            <p>Enter your details to continue playing.</p>

            <form id="login-form">

                <label for="login-username">Username</label>

                <input
                    type="text"
                    id="login-username"
                    name="username"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="login-password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        aria-label="Show password"
                        aria-pressed="false"
                        data-password-target="login-password"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="submit-button">
                    Login
                </button>

            </form>

            <p
                id="auth-message"
                class="auth-message"
                role="status"
                aria-live="polite"
            ></p>

            <p class="auth-link">
                Don't have an account?
                <a href="/register.html">Create an account</a>
            </p>

        </section>

        <footer>
            <p>Banana Quest · Solve puzzles and test your skills!</p>
        </footer>

    </main>

    <script>
        document.querySelectorAll(".toggle-password").forEach((button) => {
            button.addEventListener("click", () => {
                const passwordId = button.dataset.passwordTarget;
                const passwordInput = document.getElementById(passwordId);

                const shouldShow = passwordInput.type === "password";

                passwordInput.type = shouldShow ? "text" : "password";

                button.setAttribute(
                    "aria-label",
                    shouldShow ? "Hide password" : "Show password"
                );

                button.setAttribute(
                    "aria-pressed",
                    String(shouldShow)
                );

                // Swap between the open-eye and crossed-eye icons.
                button.innerHTML = shouldShow
                    ? `
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 3l18 18"></path>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-4 4.8"></path>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.2 3.3-.6"></path>
                        </svg>
                    `
                    : `
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    `;
            });
        });

        const loginForm = document.getElementById("login-form");
        const authMessage = document.getElementById("auth-message");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document
                .getElementById("login-username")
                .value.trim();

            const password = document
                .getElementById("login-password")
                .value;

            const submitButton = loginForm.querySelector(
                "button[type='submit']"
            );

            submitButton.disabled = true;

            authMessage.textContent = "Logging in...";
            authMessage.className = "auth-message";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message ||
                        result.error ||
                        "Login failed."
                    );
                }

                authMessage.textContent =
                    result.message || "Login successful!";

                authMessage.className = "auth-message success";

                window.location.href = "/dashboard.html";

            } catch (error) {
                authMessage.textContent =
                    error.message ||
                    "Unable to log in. Please try again.";

                authMessage.className = "auth-message error";

            } finally {
                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
